<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>meaningless portal</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>アプリの倉庫</h1>
      <p class="sub">
        制作したアプリ一覧です。使ってみてください。<br>
      </p>

      <div class="stats">
        <div class="pill" id="stat1">睡魔: --</div>
        <div class="pill" id="stat2">意味: 0%</div>
        <div class="pill" id="stat3">やる気: 未検出</div>
      </div>

      <div class="row">
        <button class="btn" id="btnReroll">ランダムに納得する</button>
        <button class="btn ghost" id="btnCopy">今日の言い訳をコピー</button>
      </div>
    </header>

    <section class="panel">
      <h2>作品</h2>

      <div class="search">
        <input id="search" type="text" placeholder="検索（意味はありません）" />
        <span class="hint">※入力内容は解釈されません</span>
      </div>

      <div class="grid" id="grid"></div>
    </section>

    <footer class="foot">
      <small>
        data exists / meaning does not<br>
        作った人： <span class="author">ogihcys-261</span><br>
        問い合わせ：
        <a href="mailto:ogihcys261@gmail.com">ogihcys261@gmail.com</a>
        /
        <a href="https://forms.gle/khd9KgJpAnE1scEv8" target="_blank" rel="noreferrer">Googleフォーム</a>
      </small>
    </footer>
  </main>

  <script>
    const WORKS = [
      {
        title: "意味のない円グラフ",
        desc: "それっぽい内訳が出ます。意味は出ません。",
        url: "https://ogihcys-261.github.io/meaningless-pie/"
      },
      {
        title: "歌詞タイピング × YouTube",
        desc: "YouTubeの動画に合わせてタイピングできます。自分で歌詞とタイミングを設定する必要がありますが",
        url: "https://ogihcys-261.github.io/typing_app/"
      },
      {
        title: "さいころ",
        desc: "運試しや順番決めにどうぞ！好きな数のさいころの設定ができます",
        url: "https://ogihcys-261.github.io/saikoroapp/"
      },
    ];

    const EXCUSES = [
      "本日は世界の密度が高かったため",
      "観測者の状態が不安定なため",
      "だいたい不可抗力です",
      "意味が0%のため",
      "仕様です（たぶん）",
      "眠気が優勢だったため",
      "トマトのせいです",
      "未定義なので未定義です",
      "今日はなんだか湿気がすごいので",
      "トンネルを掘るため",
      "私は誰ですか？",
      "地下労働するため"
    ];

    const STABILITY = [
      "不明",
      "たぶん安定",
      "観測不能",
      "めっちゃ安定",
      "それはもう安定のほかない",
      "もうだめだ"
    ];

    const ENVS = [
      "気分",
      "夜",
      "Wi-Fiが弱い場所",
      "Wi-Fiがめっちゃ強いとこ",
      "あなたの心の中"
    ];

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function pick(arr) {
      return arr[randInt(0, arr.length - 1)];
    }
    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fakeLastUpdated() {
      const daysAgo = randInt(0, 420);
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function fakeVersion() {
      const major = randInt(0, 2);
      const minor = randInt(0, 9);
      const patch = randInt(0, 20);
      return `v${major}.${minor}.${patch}`;
    }

    function renderWorks() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      WORKS.forEach(w => {
        const el = document.createElement("article");
        el.className = "card";

        const meaninglessId = String(100000 + randInt(0, 899999));
        const updated = fakeLastUpdated();
        const version = fakeVersion();
        const stability = pick(STABILITY);
        const env = pick(ENVS);

        el.innerHTML = `
          <div class="cardTop">
            <div class="badge">ID:${meaninglessId}</div>
            <div class="badge ghost">STATUS: ok (probably)</div>
          </div>

          <h3>${w.title}</h3>
          <p class="desc">${w.desc}</p>

          <p class="meta">
            最終更新日（適当）：${updated}<br>
            バージョン：${version}<br>
            安定度：${stability}<br>
            対応環境：${env}
          </p>

          <div class="row">
            <a class="btn" href="${w.url}" target="_blank" rel="noreferrer">Open</a>
          </div>
        `;
        grid.appendChild(el);
      });
    }

    function rerollStats() {
      document.getElementById("stat1").textContent = `睡魔: ${randInt(3, 97)}%`;
      document.getElementById("stat2").textContent = "意味: 0%";
      document.getElementById("stat3").textContent =
        `やる気: ${pick(["未検出", "欠損", "推定", "保留", "N/A"])}`;
    }

    async function copyExcuse() {
      const text = `【今日の言い訳】\n${pick(EXCUSES)}\n(根拠なし)`;
      try {
        await navigator.clipboard.writeText(text);
        alert("コピーしました");
      } catch {
        prompt("コピーして使ってください", text);
      }
    }

    document.getElementById("btnReroll").addEventListener("click", () => {
      rerollStats();
      WORKS.splice(0, WORKS.length, ...shuffle(WORKS));
      renderWorks();
    });

    document.getElementById("btnCopy").addEventListener("click", copyExcuse);

    document.getElementById("search").addEventListener("input", () => {
      WORKS.splice(0, WORKS.length, ...shuffle(WORKS));
      renderWorks();
    });

    renderWorks();
    rerollStats();
  </script>
</body>
</html>
